name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

# Builds + tests the library on a main push; on a v* tag also publishes a
# GitHub Release and a signed publish to Olla. Logic lives in the reusable
# workflow. No `pull_request:` trigger by design — changes land by pushing
# straight to main, so a PR trigger would never fire. This workflow used to
# have the opposite pair (pull_request but no main push), so nothing ran.
jobs:
  release:
    uses: jklappenbach/cajeta/.github/workflows/lib-release.yml@main
    with:
      # Pin explicitly. Omitting this inherits the reusable workflow's own
      # default, which is v0.19.1 — this repo was inheriting it, and a first
      # publish would have been built by a toolchain eleven minors behind the
      # one the sources were written against.
      #
      # v0.42.1 is the newest release, and the version this package is gated
      # against: `cajeta test` reports 37 passed, 0 failed, 0 skipped, and the
      # register-user sample passes 117 of 117 checks. The security phase needs
      # it: on v0.41.0 the sample cannot build, because primavera and
      # cajeta-cloud each declare `TimeSource` and `ManualTimeSource` and the
      # loader bound one archive's class to the other's interface (cajeta
      # 91b0b8ed), and a String temporary passed to a call that threw leaked on
      # every refused token (cajeta 09be1f09). On v0.42.0 the sample faulted at
      # startup: an injected multibinding container was built on bare malloc
      # bytes (cajeta 2f28cb44), which also needs cajeta-cloud 0.3.1, rebuilt
      # under v0.42.1. The codec phase's fixes from v0.41.0 (cajeta d6d6b4d9,
      # c6d1d5fd) stay required.
      #
      # Raised to v0.43.0 with cajeta-http 0.7.0, whose request dispatch is
      # built on stdlib reads that first exist in v0.43.0. Measured 2026-10-17
      # against the published archives: `cajeta test` 38 passed, 0 failed,
      # the register-user sample 117 of 117, no primavera source changed.
      #
      # Raised to v0.43.1 the same day: on v0.43.0 an idle carrier spun at
      # full CPU beside the worker hashing a password, and on this runner's
      # two vCPUs the test step went past its 30-minute cap; v0.43.1's
      # carrier sleeps instead (the sample under two CPUs: 15:18 to 10:17).
      #
      # The pin is not what makes the ownership diagnostics appear, and the
      # comment should not claim it is. CAJETA_ERROR_OWNED_RESULT_NEEDS_TRANSFER
      # and CAJETA_ERROR_CAPTURED_BORROW_PARAM both shipped in v0.21.0 (cajeta
      # aa382ae0 and efa2a01a, confirmed with `git log -S` and
      # `git tag --contains`). What hid them here was the manifest's stale
      # toolchain pin of 0.9.2, which no release ever carried.
      # Raised to v0.44.0, the first release without the stdlib crypto: 38
      # passed and register-user 119 of 119 on it locally (crypto plan Unit 8).
      cajeta-version: v0.44.0
      # The manifest's `test` task builds with `"profile": "test"` and runs the
      # result, so the suite is self-contained and CI can call it directly.
      test-command: cajeta test
    secrets: inherit
